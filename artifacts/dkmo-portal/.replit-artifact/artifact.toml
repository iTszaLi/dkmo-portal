kind = "web"
previewPath = "/"
title = "DKMO Management Portal"
version = "1.0.0"
id = "artifacts/dkmo-portal"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22744

[services.development]
run = "pnpm --filter @workspace/dkmo-portal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dkmo-portal", "run", "build" ]
publicDir = "artifacts/dkmo-portal/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22744"
BASE_PATH = "/"
