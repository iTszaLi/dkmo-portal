openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: DKMO Management Portal API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: members
  - name: payments
  - name: dashboard
  - name: sponsors
  - name: events
  - name: tasks
  - name: frf
  - name: welfare
  - name: receipts
  - name: storage
  - name: audit

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /me:
    get:
      operationId: getCurrentUser
      tags: [health]
      summary: Get authenticated user info
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"

  /members:
    get:
      operationId: listMembers
      tags: [members]
      summary: List members with optional search
      parameters:
        - in: query
          name: search
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Member list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
    post:
      operationId: createMember
      tags: [members]
      summary: Create a member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  /members/{id}:
    get:
      operationId: getMember
      tags: [members]
      summary: Get a member by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberDetail"
    patch:
      operationId: updateMember
      tags: [members]
      summary: Update a member
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
    delete:
      operationId: deleteMember
      tags: [members]
      summary: Delete a member
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /members/{id}/fee-status:
    patch:
      operationId: updateMemberFeeStatus
      tags: [members]
      summary: Update a member's membership fee status (with audit)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeeStatusInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  /members/{id}/committee-status:
    patch:
      operationId: updateMemberCommitteeStatus
      tags: [members]
      summary: >-
        Update a member's committee membership. Executive Committee and Core
        Committee are fully independent; only the provided flags are changed.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitteeStatusInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  /members/{id}/referrals:
    get:
      operationId: getMemberReferrals
      tags: [members]
      summary: List members referred by this member and their FRF responsibility
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reference/group responsibility summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberReferralSummary"

  /payments:
    get:
      operationId: listPayments
      tags: [payments]
      summary: List payments
      parameters:
        - in: query
          name: memberId
          required: false
          schema:
            type: string
        - in: query
          name: paymentType
          required: false
          description: "Filter by payment type"
          schema:
            type: string
            enum: [membership_fee, frf_contribution]
        - in: query
          name: status
          required: false
          description: "Filter by status"
          schema:
            type: string
            enum: [paid, pending, overdue]
        - in: query
          name: paymentMethod
          required: false
          description: "Filter by payment method"
          schema:
            type: string
      responses:
        "200":
          description: Payment list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"
    post:
      operationId: createPayment
      tags: [payments]
      summary: Record a payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /payments/{id}:
    get:
      operationId: getPayment
      tags: [payments]
      summary: Get a payment by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
    delete:
      operationId: deletePayment
      tags: [payments]
      summary: Delete a payment
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Dashboard summary cards
      parameters:
        - in: query
          name: month
          required: false
          description: "Format: YYYY-MM, defaults to current month"
          schema:
            type: string
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/pending:
    get:
      operationId: getPendingMembers
      tags: [dashboard]
      summary: Members with unpaid or partial payments for the given month
      parameters:
        - in: query
          name: month
          required: false
          description: "Format: YYYY-MM, defaults to current month"
          schema:
            type: string
      responses:
        "200":
          description: Pending list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PendingMember"

  /dashboard/recent-payments:
    get:
      operationId: getRecentPayments
      tags: [dashboard]
      summary: Recent payments feed
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Recent payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecentPayment"

  /dashboard/monthly-collection:
    get:
      operationId: getMonthlyCollection
      tags: [dashboard]
      summary: Monthly collection totals over the past N months
      parameters:
        - in: query
          name: months
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Monthly buckets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MonthlyCollection"

  /dashboard/payment-method-breakdown:
    get:
      operationId: getPaymentMethodBreakdown
      tags: [dashboard]
      summary: Payment method totals
      parameters:
        - in: query
          name: paymentType
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Method breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentMethodBucket"

  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List events
      parameters:
        - in: query
          name: search
          required: false
          schema: { type: string }
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [upcoming, ongoing, completed, cancelled]
        - in: query
          name: sort
          required: false
          schema:
            type: string
            enum: [recent, name, dateAsc, dateDesc]
        - in: query
          name: page
          required: false
          schema: { type: integer, minimum: 1 }
        - in: query
          name: pageSize
          required: false
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: Event list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
    post:
      operationId: createEvent
      tags: [events]
      summary: Create an event (Admin or Event Manager)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"

  /events/{id}:
    get:
      operationId: getEvent
      tags: [events]
      summary: Get an event
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
    put:
      operationId: updateEvent
      tags: [events]
      summary: Update an event
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
    delete:
      operationId: deleteEvent
      tags: [events]
      summary: Delete an event
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted

  /events/{eventId}/sponsors:
    get:
      operationId: listEventSponsors
      tags: [events]
      summary: List sponsors for an event
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Sponsor list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EventSponsor" }
    post:
      operationId: createEventSponsor
      tags: [events]
      summary: Add a sponsor to an event
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventSponsorInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventSponsor" }

  /events/{eventId}/sponsors/{id}:
    delete:
      operationId: deleteEventSponsor
      tags: [events]
      summary: Remove a sponsor from an event
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted

  /events/{eventId}/expenses:
    get:
      operationId: listEventExpenses
      tags: [events]
      summary: List expenses for an event
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Expense list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EventExpense" }
    post:
      operationId: createEventExpense
      tags: [events]
      summary: Add an expense to an event
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventExpenseInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventExpense" }

  /events/{eventId}/expenses/{id}:
    delete:
      operationId: deleteEventExpense
      tags: [events]
      summary: Remove an expense from an event
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted

  /events/{eventId}/booklets:
    get:
      operationId: listEventBooklets
      tags: [events]
      summary: List ticket booklets for an event
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Booklet list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EventTicketBooklet" }
    post:
      operationId: createEventBooklet
      tags: [events]
      summary: Create a ticket booklet for an event
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventBookletInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventTicketBooklet" }

  /events/{eventId}/booklets/{id}:
    put:
      operationId: updateEventBooklet
      tags: [events]
      summary: Update a ticket booklet
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventBookletInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventTicketBooklet" }
    delete:
      operationId: deleteEventBooklet
      tags: [events]
      summary: Delete a ticket booklet
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted

  /events/{eventId}/booklets/{bookletId}/tickets:
    get:
      operationId: listBookletTickets
      tags: [events]
      summary: List tickets in a booklet
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: bookletId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Ticket list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EventTicket" }

  /events/{eventId}/booklets/{bookletId}/tickets/{ticketId}:
    patch:
      operationId: updateEventTicket
      tags: [events]
      summary: Update a ticket (mark sold/unsold, set buyer info)
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: bookletId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: ticketId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventTicketUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventTicket" }

  /events/{eventId}/financial-summary:
    get:
      operationId: getEventFinancialSummary
      tags: [events]
      summary: Get financial summary for an event
      parameters:
        - in: path
          name: eventId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Financial summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventFinancialSummary" }

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [pending, in_progress, completed, cancelled]
        - in: query
          name: priority
          required: false
          schema:
            type: string
            enum: [low, medium, high, urgent]
        - in: query
          name: assignedTo
          required: false
          schema: { type: string }
        - in: query
          name: sponsorId
          required: false
          schema: { type: string, format: uuid }
        - in: query
          name: eventId
          required: false
          schema: { type: string, format: uuid }
        - in: query
          name: sort
          required: false
          schema:
            type: string
            enum: [recent, dueAsc, dueDesc, priority]
        - in: query
          name: page
          required: false
          schema: { type: integer, minimum: 1 }
        - in: query
          name: pageSize
          required: false
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{id}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get a task
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    put:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted

  /dashboard/sponsor-pipeline:
    get:
      operationId: getDashboardSponsorPipeline
      tags: [dashboard]
      summary: Sponsor pipeline summary for dashboard
      responses:
        "200":
          description: Sponsor pipeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsorPipeline"

  /dashboard/financial-summary:
    get:
      operationId: getDashboardFinancialSummary
      tags: [dashboard]
      summary: Separate member vs sponsor financial summary
      parameters:
        - in: query
          name: month
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Financial summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialSummary"

  /dashboard/alerts:
    get:
      operationId: getDashboardAlerts
      tags: [dashboard]
      summary: Real-time alerts for missing data, pending payments, and issues
      responses:
        "200":
          description: Alerts list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DashboardAlert"

  /sponsors:
    get:
      operationId: listSponsors
      tags: [sponsors]
      summary: List sponsors
      parameters:
        - in: query
          name: search
          required: false
          schema: { type: string }
        - in: query
          name: tier
          required: false
          schema:
            type: string
            enum: [platinum, gold, silver, bronze]
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [pending, partial, paid, overdue]
        - in: query
          name: sort
          required: false
          schema:
            type: string
            enum: [recent, name, totalDesc, totalAsc, pendingDesc]
        - in: query
          name: page
          required: false
          schema: { type: integer, minimum: 1 }
        - in: query
          name: pageSize
          required: false
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: Sponsor list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsorList"
    post:
      operationId: createSponsor
      tags: [sponsors]
      summary: Create a sponsor (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SponsorInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sponsor"

  /sponsors/{id}:
    get:
      operationId: getSponsor
      tags: [sponsors]
      summary: Get a sponsor
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Sponsor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sponsor"
    put:
      operationId: updateSponsor
      tags: [sponsors]
      summary: Update a sponsor (Admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SponsorInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sponsor"
    delete:
      operationId: deleteSponsor
      tags: [sponsors]
      summary: Delete a sponsor (Admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted

  /frf/claims:
    get:
      operationId: listFrfClaims
      tags: [frf]
      summary: List FRF claims
      parameters:
        - in: query
          name: status
          required: false
          schema: { type: string }
        - in: query
          name: claimType
          required: false
          schema: { type: string }
      responses:
        "200":
          description: FRF claims list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FrfClaim"
    post:
      operationId: createFrfClaim
      tags: [frf]
      summary: Create FRF claim
      requestBody:
        required: true
        content:
          application/json:
