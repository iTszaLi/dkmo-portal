components:
  schemas:
    AuditLog:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        userName: { type: string }
        action: { type: string }
        module: { type: string }
        entityId: { type: ["string", "null"] }
        entityName: { type: ["string", "null"] }
        details: { type: ["string", "null"] }
        ipAddress: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
      required: [id, userId, userName, action, module, createdAt]

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    CurrentUser:
      type: object
      properties:
        userId:
          type: string
        username:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [admin, finance, event, viewer]
        email:
          type: ["string", "null"]
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
      required: [userId, username, displayName, role]

    Sponsor:
      type: object
      properties:
        id: { type: string }
        sponsorName: { type: string }
        company: { type: string }
        contactPerson: { type: string }
        phone: { type: string }
        email: { type: string }
        tier:
          type: string
          enum: [platinum, gold, silver, bronze]
        totalAmount: { type: number }
        paidAmount: { type: number }
        pendingAmount: { type: number }
        status:
          type: string
          enum: [pending, partial, paid, overdue]
        transferMethod:
          type: string
          enum: [bank_transfer, cash, cheque]
        assignedStaff: { type: string }
        linkedEvent: { type: string }
        dueDate:
          type: ["string", "null"]
          format: date-time
        notes: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required:
        - id
        - sponsorName
        - company
        - contactPerson
        - phone
        - email
        - tier
        - totalAmount
        - paidAmount
        - pendingAmount
        - status
        - transferMethod
        - assignedStaff
        - linkedEvent
        - notes
        - createdAt
        - updatedAt

    SponsorInput:
      type: object
      properties:
        sponsorName: { type: string, minLength: 1 }
        company: { type: string }
        contactPerson: { type: string }
        phone: { type: string }
        email: { type: string }
        tier:
          type: string
          enum: [platinum, gold, silver, bronze]
        totalAmount: { type: number, minimum: 0 }
        paidAmount: { type: number, minimum: 0 }
        status:
          type: string
          enum: [pending, partial, paid, overdue]
        transferMethod:
          type: string
          enum: [bank_transfer, cash, cheque]
        assignedStaff: { type: string }
        linkedEvent: { type: string }
        dueDate:
          type: ["string", "null"]
          format: date-time
        notes: { type: string }
      required: [sponsorName]

    SponsorList:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Sponsor" }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
      required: [items, page, pageSize, total]

    Member:
      type: object
      properties:
        id:
          type: string
        fullName:
          type: string
        mobileNumber:
          type: string
        membershipId:
          type: string
        applicationNumber:
          type: string
        iqamaNumber:
          type: string
        jamaath:
          type: string
        city:
          type: string
        country:
          type: string
        designation:
          type: string
        isExecutiveCommittee:
          type: boolean
        isCoreCommittee:
          type: boolean
        membershipFee:
          type: number
        feeStatus:
          type: string
          enum: [paid, pending, unpaid]
        feePaidAt:
          type: ["string", "null"]
          format: date-time
        feeUpdatedBy:
          type: string
        frfStatus:
          type: string
          enum: [active, suspended, inactive]
        refMemberName:
          type: string
        refMemberId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - fullName
        - mobileNumber
        - membershipId
        - applicationNumber
        - iqamaNumber
        - jamaath
        - city
        - country
        - designation
        - isExecutiveCommittee
        - isCoreCommittee
        - membershipFee
        - feeStatus
        - feePaidAt
        - feeUpdatedBy
        - frfStatus
        - refMemberName
        - refMemberId
        - createdAt
        - updatedAt

    MemberDetail:
      type: object
      properties:
        id:
          type: string
        fullName:
          type: string
        mobileNumber:
          type: string
        membershipId:
          type: string
        applicationNumber:
          type: string
        iqamaNumber:
          type: string
        jamaath:
          type: string
        city:
          type: string
        country:
          type: string
        designation:
          type: string
        isExecutiveCommittee:
          type: boolean
        isCoreCommittee:
          type: boolean
        membershipFee:
          type: number
        feeStatus:
          type: string
          enum: [paid, pending, unpaid]
        feePaidAt:
          type: ["string", "null"]
          format: date-time
        feeUpdatedBy:
          type: string
        frfStatus:
          type: string
          enum: [active, suspended, inactive]
        refMemberName:
          type: string
        refMemberId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - fullName
        - mobileNumber
        - membershipId
        - applicationNumber
        - iqamaNumber
        - jamaath
        - city
        - country
        - designation
        - isExecutiveCommittee
        - isCoreCommittee
        - membershipFee
        - feeStatus
        - feePaidAt
        - feeUpdatedBy
        - frfStatus
        - refMemberName
        - refMemberId
        - createdAt
        - updatedAt

    MemberInput:
      type: object
      properties:
        fullName:
          type: string
          minLength: 1
        mobileNumber:
          type: string
          minLength: 1
        membershipId:
          type: string
          description: >-
            Optional. When omitted or blank the server auto-generates the next
            membership number in the format DKMO-YYYY-XXXX.
        applicationNumber:
          type: string
        iqamaNumber:
          type: string
        jamaath:
          type: string
        city:
          type: string
        country:
          type: string
        designation:
          type: string
        isExecutiveCommittee:
          type: boolean
        isCoreCommittee:
          type: boolean
        membershipFee:
          type: number
        feeStatus:
          type: string
          enum: [paid, pending, unpaid]
        frfStatus:
          type: string
          enum: [active, suspended, inactive]
        refMemberName:
          type: string
        refMemberId:
          type: string
      required:
        - fullName
        - mobileNumber

    FeeStatusInput:
      type: object
      properties:
        feeStatus:
          type: string
          enum: [paid, pending, unpaid]
      required:
        - feeStatus

    CommitteeStatusInput:
      type: object
      description: >-
        Partial update of a member's committee membership. Executive Committee
        and Core Committee are independent; supply only the flag you want to
        change. Omitting a flag leaves it untouched.
      properties:
        isExecutiveCommittee:
          type: boolean
        isCoreCommittee:
          type: boolean

    MemberReferralItem:
      type: object
      properties:
        id:
          type: string
        fullName:
          type: string
        membershipId:
          type: string
        mobileNumber:
          type: string
        city:
          type: string
        feeStatus:
          type: string
          enum: [paid, pending, unpaid]
      required:
        - id
        - fullName
        - membershipId
        - mobileNumber
        - city
        - feeStatus

    MemberReferralSummary:
      type: object
      properties:
        referenceMemberName:
          type: string
        totalCount:
          type: integer
        frfResponsibilityAmount:
          type: number
        members:
          type: array
          items:
            $ref: "#/components/schemas/MemberReferralItem"
      required:
        - referenceMemberName
        - totalCount
        - frfResponsibilityAmount
        - members

    Payment:
      type: object
      properties:
        id:
          type: string
        memberId:
          type: string
        memberName:
          type: string
        membershipId:
          type: string
        paymentType:
          type: string
          enum: [membership_fee, frf_contribution]
        frfClaimId:
          type: ["string", "null"]
        amountDue:
          type: number
        amountPaid:
          type: number
        status:
          type: string
          enum: [paid, pending, overdue]
        paymentMethod:
          type: string
          enum: [cash, upi, bank_transfer, card, cheque, other]
        receiptNumber:
          type: string
        notes:
          type: ["string", "null"]
        dueDate:
          type: ["string", "null"]
          format: date-time
        paidAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - memberId
        - memberName
        - membershipId
        - paymentType
        - amountDue
        - amountPaid
        - status
        - paymentMethod
        - receiptNumber
        - paidAt
        - createdAt

    PaymentInput:
      type: object
      properties:
        memberId:
          type: string
        paymentType:
          type: string
          enum: [membership_fee, frf_contribution]
        frfClaimId:
          type: ["string", "null"]
        amountDue:
          type: number
        amountPaid:
          type: number
        status:
          type: string
          enum: [paid, pending, overdue]
        paymentMethod:
          type: string
          enum: [cash, upi, bank_transfer, card, cheque, other]
        receiptNumber:
          type: string
          minLength: 1
        notes:
          type: ["string", "null"]
        dueDate:
          type: ["string", "null"]
          format: date-time
        paidAt:
          type: ["string", "null"]
          format: date-time
      required:
        - memberId
        - amountPaid
        - paymentMethod
        - receiptNumber

    DashboardSummary:
      type: object
      properties:
        totalMembers:
          type: integer
        paidMembersCount:
          type: integer
        pendingMembersCount:
          type: integer
        unpaidMembersCount:
          type: integer
        totalFeesCollected:
          type: number
        outstandingFees:
          type: number
        membershipFeeTotal:
          type: number
      required:
        - totalMembers
        - paidMembersCount
        - pendingMembersCount
        - unpaidMembersCount
        - totalFeesCollected
        - outstandingFees
        - membershipFeeTotal

    PendingMember:
      type: object
      properties:
        memberId:
          type: string
        fullName:
          type: string
        mobileNumber:
          type: string
        membershipId:
          type: string
        city:
          type: string
        country:
          type: string
        membershipFee:
          type: number
        feeStatus:
          type: string
          enum: [pending, unpaid]
        refMemberName:
          type: string
        refMemberId:
          type: string
      required:
        - memberId
        - fullName
        - mobileNumber
        - membershipId
        - city
        - country
        - membershipFee
        - feeStatus
        - refMemberName
        - refMemberId

    RecentPayment:
      type: object
      properties:
        id:
          type: string
        memberId:
          type: string
        memberName:
          type: string
        membershipId:
          type: string
        paymentType:
          type: string
        amountPaid:
          type: number
        paymentMethod:
          type: string
        receiptNumber:
          type: string
        paidAt:
          type: string
          format: date-time
      required:
        - id
        - memberId
        - memberName
        - membershipId
        - paymentType
        - amountPaid
        - paymentMethod
        - receiptNumber
        - paidAt

    MonthlyCollection:
      type: object
      properties:
        month:
          type: string
        total:
          type: number
        paymentCount:
          type: integer
      required: [month, total, paymentCount]

    PaymentMethodBucket:
      type: object
      properties:
        method:
          type: string
        total:
          type: number
        count:
          type: integer
      required: [method, total, count]

    SponsorPipelineTierBucket:
      type: object
      properties:
        tier: { type: string }
        count: { type: integer }
        pledged: { type: number }
        collected: { type: number }
        pending: { type: number }
      required: [tier, count, pledged, collected, pending]

    SponsorPipeline:
      type: object
      properties:
        totalSponsors: { type: integer }
        totalPledged: { type: number }
