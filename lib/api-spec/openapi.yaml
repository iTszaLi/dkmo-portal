openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: DKMO Management Portal API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: members
  - name: payments
  - name: dashboard
  - name: sponsors
  - name: events
  - name: tasks
  - name: frf
  - name: frf-membership
  - name: receipts
  - name: storage

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /me:
    get:
      operationId: getCurrentUser
      tags: [health]
      summary: Get authenticated user info
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"

  /members:
    get:
      operationId: listMembers
      tags: [members]
      summary: List members with optional search
      parameters:
        - in: query
          name: search
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Member list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
    post:
      operationId: createMember
      tags: [members]
      summary: Create a member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  /members/{id}:
    get:
      operationId: getMember
      tags: [members]
      summary: Get a member by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberDetail"
    patch:
      operationId: updateMember
      tags: [members]
      summary: Update a member
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
    delete:
      operationId: deleteMember
      tags: [members]
      summary: Delete a member
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /payments:
    get:
      operationId: listPayments
      tags: [payments]
      summary: List payments
      parameters:
        - in: query
          name: memberId
          required: false
          schema:
            type: string
        - in: query
          name: month
          required: false
          description: "Format: YYYY-MM (single month, ignored if fromMonth/toMonth provided)"
          schema:
            type: string
        - in: query
          name: fromMonth
          required: false
          description: "Format: YYYY-MM (inclusive start of range)"
          schema:
            type: string
        - in: query
          name: toMonth
          required: false
          description: "Format: YYYY-MM (inclusive end of range)"
          schema:
            type: string
        - in: query
          name: paymentMethod
          required: false
          description: "Filter by payment method"
          schema:
            type: string
      responses:
        "200":
          description: Payment list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Payment"
    post:
      operationId: createPayment
      tags: [payments]
      summary: Record a payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"

  /payments/{id}:
    get:
      operationId: getPayment
      tags: [payments]
      summary: Get a payment by id
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
    delete:
      operationId: deletePayment
      tags: [payments]
      summary: Delete a payment
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Dashboard summary cards
      parameters:
        - in: query
          name: month
          required: false
          description: "Format: YYYY-MM, defaults to current month"
          schema:
            type: string
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/pending:
    get:
      operationId: getPendingMembers
      tags: [dashboard]
      summary: Members with unpaid or partial payments for the given month
      parameters:
        - in: query
          name: month
          required: false
          description: "Format: YYYY-MM, defaults to current month"
          schema:
            type: string
      responses:
        "200":
          description: Pending list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PendingMember"

  /dashboard/recent-payments:
    get:
      operationId: getRecentPayments
      tags: [dashboard]
      summary: Recent payments feed
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Recent payments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecentPayment"

  /dashboard/monthly-collection:
    get:
      operationId: getMonthlyCollection
      tags: [dashboard]
      summary: Monthly collection totals over the past N months
      parameters:
        - in: query
          name: months
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Monthly buckets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MonthlyCollection"

  /dashboard/payment-method-breakdown:
    get:
      operationId: getPaymentMethodBreakdown
      tags: [dashboard]
      summary: Payment method totals for given month
      parameters:
        - in: query
          name: month
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Method breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentMethodBucket"

  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: List events
      parameters:
        - in: query
          name: search
          required: false
          schema: { type: string }
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [upcoming, ongoing, completed, cancelled]
        - in: query
          name: sort
          required: false
          schema:
            type: string
            enum: [recent, name, dateAsc, dateDesc]
        - in: query
          name: page
          required: false
          schema: { type: integer, minimum: 1 }
        - in: query
          name: pageSize
          required: false
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: Event list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
    post:
      operationId: createEvent
      tags: [events]
      summary: Create an event (Admin or Event Manager)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"

  /events/{id}:
    get:
      operationId: getEvent
      tags: [events]
      summary: Get an event
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
    put:
      operationId: updateEvent
      tags: [events]
      summary: Update an event
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
    delete:
      operationId: deleteEvent
      tags: [events]
      summary: Delete an event
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks
      parameters:
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [pending, in_progress, completed, cancelled]
        - in: query
          name: priority
          required: false
          schema:
            type: string
            enum: [low, medium, high, urgent]
        - in: query
          name: assignedTo
          required: false
          schema: { type: string }
        - in: query
          name: sponsorId
          required: false
          schema: { type: string, format: uuid }
        - in: query
          name: eventId
          required: false
          schema: { type: string, format: uuid }
        - in: query
          name: sort
          required: false
          schema:
            type: string
            enum: [recent, dueAsc, dueDesc, priority]
        - in: query
          name: page
          required: false
          schema: { type: integer, minimum: 1 }
        - in: query
          name: pageSize
          required: false
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskList"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/{id}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get a task
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    put:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted

  /dashboard/sponsor-pipeline:
    get:
      operationId: getDashboardSponsorPipeline
      tags: [dashboard]
      summary: Sponsor pipeline summary for dashboard
      responses:
        "200":
          description: Sponsor pipeline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsorPipeline"

  /dashboard/financial-summary:
    get:
      operationId: getDashboardFinancialSummary
      tags: [dashboard]
      summary: Separate member vs sponsor financial summary
      parameters:
        - in: query
          name: month
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Financial summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialSummary"

  /dashboard/alerts:
    get:
      operationId: getDashboardAlerts
      tags: [dashboard]
      summary: Real-time alerts for missing data, pending payments, and issues
      responses:
        "200":
          description: Alerts list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DashboardAlert"

  /sponsors:
    get:
      operationId: listSponsors
      tags: [sponsors]
      summary: List sponsors
      parameters:
        - in: query
          name: search
          required: false
          schema: { type: string }
        - in: query
          name: tier
          required: false
          schema:
            type: string
            enum: [platinum, gold, silver, bronze]
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [pending, partial, paid, overdue]
        - in: query
          name: sort
          required: false
          schema:
            type: string
            enum: [recent, name, totalDesc, totalAsc, pendingDesc]
        - in: query
          name: page
          required: false
          schema: { type: integer, minimum: 1 }
        - in: query
          name: pageSize
          required: false
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: Sponsor list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SponsorList"
    post:
      operationId: createSponsor
      tags: [sponsors]
      summary: Create a sponsor (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SponsorInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sponsor"

  /sponsors/{id}:
    get:
      operationId: getSponsor
      tags: [sponsors]
      summary: Get a sponsor
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Sponsor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sponsor"
    put:
      operationId: updateSponsor
      tags: [sponsors]
      summary: Update a sponsor (Admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SponsorInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sponsor"
    delete:
      operationId: deleteSponsor
      tags: [sponsors]
      summary: Delete a sponsor (Admin only)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted

  /frf/claims:
    get:
      operationId: listFrfClaims
      tags: [frf]
      summary: List FRF claims
      parameters:
        - in: query
          name: status
          required: false
          schema: { type: string }
        - in: query
          name: claimType
          required: false
          schema: { type: string }
      responses:
        "200":
          description: FRF claims list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FrfClaim"
    post:
      operationId: createFrfClaim
      tags: [frf]
      summary: Create FRF claim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FrfClaimInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrfClaim"

  /frf/stats:
    get:
      operationId: getFrfStats
      tags: [frf]
      summary: Get FRF statistics
      responses:
        "200":
          description: FRF stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrfStats"

  /frf/claims/{id}:
    get:
      operationId: getFrfClaim
      tags: [frf]
      summary: Get a FRF claim
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: FRF claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrfClaim"
    put:
      operationId: updateFrfClaim
      tags: [frf]
      summary: Update a FRF claim
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FrfClaimInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrfClaim"
    delete:
      operationId: deleteFrfClaim
      tags: [frf]
      summary: Delete a FRF claim
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted

  /frf/memberships:
    get:
      operationId: listFrfMemberships
      tags: [frf-membership]
      summary: List FRF memberships
      parameters:
        - in: query
          name: search
          required: false
          schema: { type: string }
        - in: query
          name: status
          required: false
          schema: { type: string }
      responses:
        "200":
          description: FRF membership list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FrfMembership"
    post:
      operationId: createFrfMembership
      tags: [frf-membership]
      summary: Create FRF membership (authenticated)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FrfMembershipInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrfMembership"

  /frf/memberships/apply:
    post:
      operationId: applyFrfMembership
      tags: [frf-membership]
      summary: Public FRF membership application (no auth required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FrfMembershipInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrfMembership"

  /frf/memberships/track:
    get:
      operationId: trackFrfMembership
      tags: [frf-membership]
      summary: Track FRF application by number or mobile (public)
      parameters:
        - in: query
          name: frfNumber
          required: false
          schema: { type: string }
        - in: query
          name: mobile
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Application tracking info
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FrfMembershipTrack"

  /frf/memberships/stats:
    get:
      operationId: getFrfMembershipStats
      tags: [frf-membership]
      summary: Get FRF membership statistics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrfMembershipStats"

  /frf/memberships/{id}:
    get:
      operationId: getFrfMembership
      tags: [frf-membership]
      summary: Get a FRF membership with dependents
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: FRF membership with dependents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrfMembershipDetail"
    patch:
      operationId: updateFrfMembership
      tags: [frf-membership]
      summary: Update FRF membership
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FrfMembershipInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrfMembership"
    delete:
      operationId: deleteFrfMembership
      tags: [frf-membership]
      summary: Delete FRF membership
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted

  /frf/memberships/{id}/dependents:
    post:
      operationId: addFrfDependent
      tags: [frf-membership]
      summary: Add a dependent to FRF membership
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FrfDependentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FrfDependent"

  /frf/dependents/{id}:
    delete:
      operationId: deleteFrfDependent
      tags: [frf-membership]
      summary: Delete a FRF dependent
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted

  /dashboard/cash-flow:
    get:
      operationId: getDashboardCashFlow
      tags: [dashboard]
      summary: Get cash flow summary and upcoming events
      responses:
        "200":
          description: Cash flow data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardCashFlow"

  /receipts:
    get:
      operationId: listReceiptRecords
      tags: [receipts]
      summary: List saved receipt records
      parameters:
        - in: query
          name: search
          required: false
          schema: { type: string }
        - in: query
          name: page
          required: false
          schema: { type: integer, default: 1 }
        - in: query
          name: pageSize
          required: false
          schema: { type: integer, default: 25 }
      responses:
        "200":
          description: Paginated list of receipts
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReceiptRecord"
                  total: { type: integer }
                required: [items, total]
    post:
      operationId: createReceiptRecord
      tags: [receipts]
      summary: Save a generated receipt record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiptRecordInput"
      responses:
        "201":
          description: Created receipt record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptRecord"

  /receipts/{id}:
    delete:
      operationId: deleteReceiptRecord
      tags: [receipts]
      summary: Delete a saved receipt record
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUploadUrlBody"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestUploadUrlResponse"

  /storage/objects/{objectPath}:
    get:
      operationId: getStorageObject
      tags: [storage]
      summary: Serve an uploaded object
      parameters:
        - in: path
          name: objectPath
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Object content
          content:
            "*/*":
              schema:
                type: string
                format: binary

